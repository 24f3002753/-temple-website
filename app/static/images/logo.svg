<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E40" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
  </defs>
  <!-- Outer Ornate Ring -->
  <circle cx="100" cy="100" r="94" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#7A0000" stroke-width="2" stroke-dasharray="4,3" />

  <!-- Kalash Base / Ghata -->
  <path d="M 75 140 Q 60 115 72 95 L 128 95 Q 140 115 125 140 Z" fill="url(#saffronGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  <!-- Kalash Neck and Rim -->
  <path d="M 68 95 L 132 95 Q 136 90 130 87 L 70 87 Q 64 90 68 95 Z" fill="url(#goldGrad)" />
  <rect x="74" y="140" width="52" height="10" rx="3" fill="url(#goldGrad)" />

  <!-- Mango Leaves (Amra Pallava) -->
  <path d="M 72 87 Q 55 65 48 48 Q 68 55 80 87 Z" fill="#2E7D32" />
  <path d="M 128 87 Q 145 65 152 48 Q 132 55 120 87 Z" fill="#2E7D32" />
  <path d="M 85 87 Q 78 50 72 38 Q 92 50 95 87 Z" fill="#388E3C" />
  <path d="M 115 87 Q 122 50 128 38 Q 108 50 105 87 Z" fill="#388E3C" />

  <!-- Coconut (Nariyal) & Flag -->
  <ellipse cx="100" cy="72" rx="20" ry="24" fill="#6D4C41" stroke="url(#goldGrad)" stroke-width="2" />
  <!-- Auspicious Tilak / Tripundra -->
  <path d="M 85 116 Q 100 126 115 116" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="100" cy="122" r="3.5" fill="#C62828" />

  <!-- Sacred Flag on Top -->
  <path d="M 100 48 L 100 22 L 125 32 L 100 42 Z" fill="#FF6F00" stroke="url(#goldGrad)" stroke-width="1.5" />
  <line x1="100" y1="48" x2="100" y2="18" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Sacred Text -->
  <text x="100" y="172" font-family="'Mukta', sans-serif" font-size="16" font-weight="bold" fill="#7A0000" text-anchor="middle">॥ श्री देवस्थान ॥</text>
</svg>
