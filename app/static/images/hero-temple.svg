<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#311B0B" />
      <stop offset="40%" stop-color="#7B1E05" />
      <stop offset="75%" stop-color="#D85A00" />
      <stop offset="100%" stop-color="#F9A825" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FFD54F" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="templeSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1204" />
      <stop offset="100%" stop-color="#1A0700" />
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A3" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="700" fill="url(#skyGrad)" />
  <!-- Radiant Morning Glow -->
  <circle cx="800" cy="360" r="380" fill="url(#sunGlow)" />

  <!-- Distant Ghats / Sahyadri Mountain Silhouettes -->
  <path d="M 0 520 Q 250 420 500 480 T 1000 460 T 1600 490 L 1600 700 L 0 700 Z" fill="#200B03" opacity="0.5" />

  <!-- Grand Temple Complex Architecture (Central Shikhara & Mandapa) -->
  <!-- Left Subsidiary Temple Shikhara -->
  <path d="M 380 550 L 420 380 L 440 280 L 450 220 L 460 280 L 480 380 L 520 550 Z" fill="url(#templeSilhouette)" />
  <circle cx="450" cy="214" r="7" fill="url(#goldTrim)" />
  <line x1="450" y1="214" x2="450" y2="195" stroke="url(#goldTrim)" stroke-width="2" />
  <polygon points="450,195 470,205 450,215" fill="#FF6F00" />

  <!-- Right Subsidiary Temple Shikhara -->
  <path d="M 1080 550 L 1120 380 L 1140 280 L 1150 220 L 1160 280 L 1180 380 L 1220 550 Z" fill="url(#templeSilhouette)" />
  <circle cx="1150" cy="214" r="7" fill="url(#goldTrim)" />
  <line x1="1150" y1="214" x2="1150" y2="195" stroke="url(#goldTrim)" stroke-width="2" />
  <polygon points="1150,195 1170,205 1150,215" fill="#FF6F00" />

  <!-- Main Central Nagara / Hemadpanthi Shikhara -->
  <path d="M 620 580 
           L 680 430 Q 720 310 770 200 
           L 790 130 L 800 100 L 810 130 
           Q 860 200 900 310 L 940 430 
           L 1000 580 Z" 
        fill="url(#templeSilhouette)" />

  <!-- Kalash & Pataka (Flag) on Apex of Central Shikhara -->
  <circle cx="800" cy="94" r="12" fill="url(#goldTrim)" />
  <polygon points="796,82 804,82 800,70" fill="url(#goldTrim)" />
  <line x1="800" y1="70" x2="800" y2="35" stroke="url(#goldTrim)" stroke-width="3" />
  <!-- Sacred Saffron Flag (Bhagwa Dhwaj) -->
  <polygon points="800,35 860,52 800,68" fill="#FF6F00" stroke="#FFD54F" stroke-width="1.5" />

  <!-- Mandapa & Pillared Sabha-Gruha -->
  <rect x="520" y="470" width="560" height="150" fill="url(#templeSilhouette)" rx="4" />
  <!-- Pillar Openings / Arches -->
  <path d="M 580 620 L 580 530 Q 610 500 640 530 L 640 620 Z" fill="#0D0402" />
  <path d="M 680 620 L 680 530 Q 710 500 740 530 L 740 620 Z" fill="#0D0402" />
  <path d="M 780 620 L 780 515 Q 810 480 840 515 L 840 620 Z" fill="#FFD54F" opacity="0.3" />
  <path d="M 880 620 L 880 530 Q 910 500 940 530 L 940 620 Z" fill="#0D0402" />
  <path d="M 980 620 L 980 530 Q 1010 500 1040 530 L 1040 620 Z" fill="#0D0402" />

  <!-- Deepstambha (Traditional Maharashtrian Stone Lamp Pillars) -->
  <!-- Left Deepstambha -->
  <path d="M 220 640 L 235 340 L 245 330 L 255 340 L 270 640 Z" fill="url(#templeSilhouette)" />
  <circle cx="245" cy="322" r="6" fill="url(#goldTrim)" />
  <!-- Right Deepstambha -->
  <path d="M 1330 640 L 1345 340 L 1355 330 L 1365 340 L 1380 640 Z" fill="url(#templeSilhouette)" />
  <circle cx="1355" cy="322" r="6" fill="url(#goldTrim)" />

  <!-- Temple Plinth / Foundation Steps -->
  <rect x="0" y="615" width="1600" height="85" fill="#180702" />
  <line x1="0" y1="615" x2="1600" y2="615" stroke="url(#goldTrim)" stroke-width="4" />
  <line x1="0" y1="635" x2="1600" y2="635" stroke="#7A0000" stroke-width="2" />
</svg>
