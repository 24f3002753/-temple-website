# ==============================================================================
# Nginx उत्पादन संरूपण (Production Nginx Reverse Proxy & SSL Configuration)
# श्री देवस्थान विश्वस्त व्यवस्था (Temple Trust Website)
# ==============================================================================

# दर मर्यादा (Rate Limiting) - देणगी API सुरक्षिततेसाठी
limit_req_zone $binary_remote_addr zone=donation_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

upstream temple_flask_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

# १. HTTP (Port 80) -> HTTPS (Port 443) कायमस्वरूपी पुनर्निर्देशन (301 Redirect)
server {
    listen 80;
    listen [::]:80;
    server_name templetrust.org www.templetrust.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# २. सुरक्षित HTTPS (Port 443) सर्व्हर
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name templetrust.org www.templetrust.org;

    # SSL प्रमाणपत्रे (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/templetrust.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/templetrust.org/privkey.pem;

    # SSL सुरक्षा पॅरामीटर्स (TLS 1.2 & TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # सुरक्षा शीर्षके (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; frame-src 'self' https://www.youtube.com https://api.razorpay.com;" always;

    # कमाल अपलोड आकार (Max Upload Size)
    client_max_body_size 16M;

    # Gzip कॉम्प्रेशन
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # ३. स्थिर संचिका थेट Nginx द्वारे (Static Assets Fast Caching)
    location /static/ {
        alias /var/www/temple_website/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ४. देणगी API दर मर्यादा (Rate Limiting on Donation API)
    location /api/donations/ {
        limit_req zone=donation_limit burst=5 nodelay;
        proxy_pass http://temple_flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ५. मुख्य अनुप्रयोग रिव्हर्स प्रॉक्सी (Proxy to Gunicorn)
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://temple_flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # एरर पेजेस
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
